# vhotseat config: ~/.config/vhotseat/config.yaml (or $VHOTSEAT_CONFIG).
# Two workloads on one 16 GB card: Strata (a local LLM server) and ComfyUI.
# Every key is commented. Change the paths, units and figures to your machine,
# then run `vhotseat doctor`. examples/ has one snippet per workload.

gpu:
  index: 0
  backend: auto        # nvml (no subprocess per read), nvidia-smi, or auto (nvml, else nvidia-smi)

workloads:
  # A workload is named here; that name is what `vhotseat switch NAME` takes.
  strata:
    driver: http       # described entirely by HTTP requests below
    label: Strata
    url: http://127.0.0.1:2335
    service: {systemd-user: strata}   # started when stopped; restarted when allow_restart
    # Its VRAM is found by the systemd unit its processes run in. Without
    # `vram:`, the service's unit is used; {process: SUBSTRING} matches the
    # command line instead - or the process name on Windows, where an elevated
    # process hides both ({process: strata.exe}).
    resident: {get: /health, path: loaded}   # true while its model is in VRAM
    release:
      post: /unload?wait={wait}   # {wait}: seconds to let a running answer finish
      always: true                # ask even when it looks unloaded: a load may be under way
      busy_when: [{status: 409}, {path: status, in: [busy]}]
      ok_when: [{status: 200, path: status, in: [unloaded, not loaded]}]
      # timeout: 30      # seconds the request may take on top of {wait} (default 30)
      # pre: {post: …}   # a request first, e.g. a proxy's drain (docs/guides/proxy-gate.md)
    confirm: {vram_at_most: 0}    # released once its VRAM is down to this
    load: {post: /load, timeout: 300}   # `switch strata` leaves it loaded
    model: {get: /health, path: model}  # which model it serves; picks the admission below
    # headers: {Authorization: "Bearer ${SOME_KEY}"}   # sent with every request vhotseat makes
    #                                       # to this workload. $NAME reads the environment:
    #                                       # a key doesn't belong in a file that gets pasted
    #                                       # around. Ask for one and get a 401, and status
    #                                       # says "asks for a key it isn't being sent" rather
    #                                       # than pretending the server is down.
    # body: {model_path: "{model}"}        # JSON body for a POST: {model} is what `model:`
    #                                       # says is served, {wait} the release's wait. For
    #                                       # servers that release one model at a time by id.
    # estimate:                             # optional: ask the server what one of its models
    #   from: {get: /settings/last-model}    # would cost on the card, at a given context.
    #   post: /estimate-memory               #   `from:` names the fields the body needs;
    #   body: {model_path: "{id}", n_ctx: "{ctx}"}
    #   ctx: 32768
    #   path: gpu_bytes                      # reported in status and `why`, never enforced:
    #                                       # a server may fit a model by shrinking its
    #                                       # context or spilling into RAM - that's your call,
    #                                       # the number is what makes it an informed one.
    gate:
      kind: hook       # Strata runs `vhotseat gate strata` before every load
      config: ~/Strata/strata.json   # its config file, checked by doctor
      timeout: 90      # Strata's before_load_timeout_s: the hook must fit in it
    admission:
      # RAM the machine must be able to give Strata before it may load: its
      # experts plus working memory, with some headroom. Compared with
      # *available* RAM (MemAvailable), which counts page cache the kernel can
      # drop on demand; *free* RAM is always small on a busy machine. When
      # other workloads still hold too much after releasing their models, idle
      # ones with allow_restart are restarted; if that still isn't enough, the
      # load is refused and the event log says RAM was short.
      # This default is for a model not listed under by_model (or when Strata
      # doesn't say which it serves): the largest one, to stay safe.
      min_available_ram_mib: 46000
      # VRAM that must be free on the card before Strata may load. Other
      # workloads always release the GPU first, whatever this says; this
      # catches what vhotseat doesn't manage (the desktop, a game, a release
      # that left VRAM behind).
      min_free_vram_mib: 14000
      # Per model, as /health reports it. For example, loading from idle,
      #   IQ3_XXS took 44.5 GiB of available RAM (42.5 GiB resident, 56 GiB at the peak)
      #   IQ2_XS  took 38.2 GiB (35.6 GiB resident, 47 GiB at the peak)
      # Both use ~14.7 GB of VRAM. To measure a model: load it (`vhotseat switch
      # strata` from idle), note how much MemAvailable dropped, add ~1.5 GiB.
      by_model:
        qwen3.8-flash-next-iq3_xxs: {min_available_ram_mib: 46000}
        qwen3.8-flash-next-iq2_xs: {min_available_ram_mib: 40000}
    allow_restart: true
    # priority: 50                 # 0-100, default 50. Among the workloads that may be
    #                              # unloaded for the same reason, the lowest goes first.
    # yields_to: ["*"]            # who may ask it to let go of its models: other
    #                              # workloads' names, "claims" (a game, or anything else
    #                              # that owns the card: see the claims section below),
    #                              # "pressure" (the card running short under a process
    #                              # vhotseat doesn't manage), or "*" for anyone - which
    #                              # is also the default, and every handover there has
    #                              # ever been. A newcomer that isn't listed is refused
    #                              # rather than unloaded over, and the refusal is logged
    #                              # and shown. A `switch` you type is an order and goes
    #                              # through whatever this says.

  comfy:
    driver: comfyui    # built-in: /queue, /free, restart when /free isn't enough
    label: ComfyUI
    url: http://127.0.0.1:8188
    service: {systemd-user: comfyui}
    idle_vram_mib: 1500   # its CUDA context and caches; above this it holds models
    gate:
      kind: plugin     # the guard node takes the GPU before every job
      custom_nodes: ~/ComfyUI/custom_nodes   # where the guard is installed; checked by doctor
      timeout: 300     # how long a job waits for an answer Strata is writing
    # No admission: what ComfyUI needs depends on the workflow, and it manages
    # its own memory. Other workloads still release the GPU before every job.
    # Restarted when its release leaves VRAM behind, or when another
    # workload's admission needs RAM its idle process still holds (6-15 GiB
    # after a video render). Only when its queue is empty and its last result
    # finished at least history_settle_s ago (a restart wipes /history).
    allow_restart: true

# Local patches to other projects' code that a handover depends on. An update
# of that project drops a patch silently, and the symptom shows up far away
# (a release that leaves VRAM behind, so every handover is refused). `vhotseat
# doctor` checks each marker is still in its file, and says when the installed
# version has the fix upstream so the patch can go. An entry looks like:
#
#   - name: TTS Audio Suite IndexTTS unload
#     file: ~/ComfyUI/custom_nodes/TTS-Audio-Suite/engines/index_tts/indextts/infer_v2_5.py
#     marker: "LOCAL PATCH (vhotseat)"           # a comment you put next to your change
#     doc: ~/.config/vhotseat/patches/tts-audio-suite.md   # optional: what and why
#     fixed_upstream_in: {version: 5.10.4, version_file: ~/ComfyUI/custom_nodes/TTS-Audio-Suite/pyproject.toml}
patches: []

events:
  keep: 500            # ~/.local/state/vhotseat/events.jsonl

# RAM and VRAM over time, events and log lines, for `vhotseat web`. Every
# vhotseat command records as it runs (~/.local/state/vhotseat/telemetry.db);
# `vhotseat record` (or `vhotseat web`) samples between commands too.
telemetry:
  # enabled: true
  retention_hours: 24  # ~6 MiB on disk with two workloads; ~0.8 MiB a day more per further workload
  interval_s: 5        # between samples while something samples continuously

power:
  # What a unit costs where this machine is, so `vhotseat cost` and the dashboard can
  # price the card's draw. It is the card's own watts as the driver reports them: the
  # rest of the machine, and what the PSU burns getting them there, aren't in it, so
  # read the number as a floor rather than the line on your bill.
  # A number nobody's bill matches is worse than no number, so the example ships with it
  # unset: put your own tariff in (whatever your utility calls kWh on your line) and the
  # currency symbol you want to see. Uncomment and edit:
  # price_per_kwh: 0.30      # what one kWh costs you, in the currency below
  # currency: "USD"
  # note: "provider + plan, so a year from now you know where the number came from"

# What owns the card by right rather than by arrangement: a game, or anything else you
# name. While something matches, nothing *new* loads: the LLM's gate refuses a load that
# a request would wake, and ComfyUI's guard - which asks with `switch comfy --request`,
# the queue asking on somebody's behalf - is refused too. A `switch` you type yourself is
# an order and isn't refused; neither is a requested switch that would load nothing, so a
# batch mid-flight carries on. Nothing loaded is interrupted, and no claimed process is
# ever touched: vhotseat doesn't kill games, it declines to load 20 GB on top of one. The
# check runs inside every decision, so nothing resident is needed for it to hold;
# `vhotseat watch` only records it. See docs/how-it-works.md §3.7.
#
# The built-in rules know the usual installations: Steam (anything under
# steamapps\common), Epic Games, Riot Games, anything under a \Games\ folder, Roblox, and
# a few named exes. Launchers (Steam, Epic, EA, Riot, Battle.net, Ubisoft) and their
# helper processes never claim the card by a built-in rule: they run all day. A rule of
# your own can still name one. Add what's missing:
#
# claims:
#   - path: '*\World of Warcraft\*'    # matched against the process's image path
#     note: World of Warcraft          # how a refusal describes it
#   - name: rocketleague.exe           # or by exe name: works when the path can't be
#                                      # read, e.g. the game runs elevated
#   - parent: mylauncher.exe           # or by any ancestor's exe name; it matches that
#                                      # launcher's helpers too, so prefer path or name
#   on_start: release                  # what happens when it appears: release (default)
#                                      # asks the idle workloads to let go of their models -
#                                      # nothing running is interrupted - block only refuses
#                                      # new loads, which is all vhotseat used to do
# claims_builtin: true                 # false leaves only the rules you wrote
# claims_poll_s: 2                     # how often `vhotseat watch` looks for a claim (the
#                                      # telemetry sampler keeps its own, slower interval)
# claims_ignore: [wallpaper64.exe]     # names or globs the built-ins won't claim: the
#                                      # built-ins already skip Wallpaper Engine, SteamVR
#                                      # and the Oculus runtime, which live under
#                                      # steamapps\common\ but aren't somebody playing
#                                      # A workload whose yields_to: doesn't list "claims"
#                                      # isn't unloaded when one of these starts: it keeps
#                                      # its model, the game is short of that much VRAM, and
#                                      # `vhotseat claims` says so.
#
# pressure: what vhotseat does when an app it does NOT manage takes the card - a Blender
# render, a CUDA script, a browser using the GPU for something big. It never named itself and
# no claim rule covers it, so the release is the only way to answer. It releases idle workloads
# and nothing else: it never refuses a load, and it never unloads a model you load afterwards.
# On by default, slow to anger, and it needs a sampler running (`vhotseat watch` or `web`,
# which `vhotseat autostart install` starts) because "has been short for 30 s" is read from the
# samples. The defaults are measured on a 24 GiB 3090 with a 21394 MiB model loaded: the card
# sits at 779-958 MiB free, and dwm/firefox/explorer/Discord/Orca hold 3096-3269 MiB between
# them. A wrong firing costs unloading and reloading ~20 GB, so every number here is wide.
# pressure:
#   enabled: true                      # false: never release for an app vhotseat doesn't manage
#   min_free_mib: 512                  # the card is out of working room below this. Below this
#                                      # box's ordinary bottom (779), so "low" means something
#                                      # changed rather than that a model is loaded
#   sustain_s: 30                      # ...and stayed there: 6 samples at the 5 s interval, so a
#                                      # single spike (a tab opening, a video seeking) is not it
#   grow_mib: 2000                     # ...and the memory vhotseat doesn't manage is this far over
#                                      # its usual floor (the median it recorded, not its worst).
#                                      # Ten times the 173 MiB of jitter the desktop here produced
#   headroom_mib: 1000                 # release enough to get back to min_free plus this, not to
#                                      # the line that was tripped
#   end_margin_mib: 2000               # the episode ends once free is back above min_free plus
#                                      # this - wider than the trigger on purpose, so it cannot
#                                      # restart itself the moment it stops
#   cooldown_s: 600                    # no second episode this soon after the last one
#   ignore: [vmware-vmx.exe, '*cudaball*']   # never growers: a VM, a benchmark, a miner. The card
#                                      # is theirs for the taking; nothing of ours is unloaded for it
#                                      # A workload whose yields_to: doesn't list "pressure" is not
#                                      # a candidate whatever else the numbers say.
