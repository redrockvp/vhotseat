# vhotseat config: ~/.config/vhotseat/config.yaml (or $VHOTSEAT_CONFIG).
# Two workloads on one 16 GB card: Strata (a local LLM server) and ComfyUI.
# Every key is commented. Change the paths, units and figures to your machine,
# then run `vhotseat doctor`. examples/ has one snippet per workload.

gpu:
  index: 0
  backend: auto        # nvml (no subprocess per read), nvidia-smi, or auto (nvml, else nvidia-smi)

workloads:
  # A workload is named here; that name is what `vhotseat switch NAME` takes.
  strata:
    driver: http       # described entirely by HTTP requests below
    label: Strata
    url: http://127.0.0.1:2335
    service: {systemd-user: strata}   # started when stopped; restarted when allow_restart
    # Its VRAM is found by the systemd unit its processes run in. Without
    # `vram:`, the service's unit is used; {process: SUBSTRING} matches the
    # command line instead - or the process name on Windows, where an elevated
    # process hides both ({process: strata.exe}).
    resident: {get: /health, path: loaded}   # true while its model is in VRAM
    release:
      post: /unload?wait={wait}   # {wait}: seconds to let a running answer finish
      always: true                # ask even when it looks unloaded: a load may be under way
      busy_when: [{status: 409}, {path: status, in: [busy]}]
      ok_when: [{status: 200, path: status, in: [unloaded, not loaded]}]
      # timeout: 30      # seconds the request may take on top of {wait} (default 30)
      # pre: {post: …}   # a request first, e.g. a proxy's drain (docs/guides/proxy-gate.md)
    confirm: {vram_at_most: 0}    # released once its VRAM is down to this
    load: {post: /load, timeout: 300}   # `switch strata` leaves it loaded
    model: {get: /health, path: model}  # which model it serves; picks the admission below
    gate:
      kind: hook       # Strata runs `vhotseat gate strata` before every load
      config: ~/Strata/strata.json   # its config file, checked by doctor
      timeout: 90      # Strata's before_load_timeout_s: the hook must fit in it
    admission:
      # RAM the machine must be able to give Strata before it may load: its
      # experts plus working memory, with some headroom. Compared with
      # *available* RAM (MemAvailable), which counts page cache the kernel can
      # drop on demand; *free* RAM is always small on a busy machine. When
      # other workloads still hold too much after releasing their models, idle
      # ones with allow_restart are restarted; if that still isn't enough, the
      # load is refused and the event log says RAM was short.
      # This default is for a model not listed under by_model (or when Strata
      # doesn't say which it serves): the largest one, to stay safe.
      min_available_ram_mib: 46000
      # VRAM that must be free on the card before Strata may load. Other
      # workloads always release the GPU first, whatever this says; this
      # catches what vhotseat doesn't manage (the desktop, a game, a release
      # that left VRAM behind).
      min_free_vram_mib: 14000
      # Per model, as /health reports it. For example, loading from idle,
      #   IQ3_XXS took 44.5 GiB of available RAM (42.5 GiB resident, 56 GiB at the peak)
      #   IQ2_XS  took 38.2 GiB (35.6 GiB resident, 47 GiB at the peak)
      # Both use ~14.7 GB of VRAM. To measure a model: load it (`vhotseat switch
      # strata` from idle), note how much MemAvailable dropped, add ~1.5 GiB.
      by_model:
        qwen3.8-flash-next-iq3_xxs: {min_available_ram_mib: 46000}
        qwen3.8-flash-next-iq2_xs: {min_available_ram_mib: 40000}
    allow_restart: true

  comfy:
    driver: comfyui    # built-in: /queue, /free, restart when /free isn't enough
    label: ComfyUI
    url: http://127.0.0.1:8188
    service: {systemd-user: comfyui}
    idle_vram_mib: 1500   # its CUDA context and caches; above this it holds models
    gate:
      kind: plugin     # the guard node takes the GPU before every job
      custom_nodes: ~/ComfyUI/custom_nodes   # where the guard is installed; checked by doctor
      timeout: 300     # how long a job waits for an answer Strata is writing
    # No admission: what ComfyUI needs depends on the workflow, and it manages
    # its own memory. Other workloads still release the GPU before every job.
    # Restarted when its release leaves VRAM behind, or when another
    # workload's admission needs RAM its idle process still holds (6-15 GiB
    # after a video render). Only when its queue is empty and its last result
    # finished at least history_settle_s ago (a restart wipes /history).
    allow_restart: true

# Local patches to other projects' code that a handover depends on. An update
# of that project drops a patch silently, and the symptom shows up far away
# (a release that leaves VRAM behind, so every handover is refused). `vhotseat
# doctor` checks each marker is still in its file, and says when the installed
# version has the fix upstream so the patch can go. An entry looks like:
#
#   - name: TTS Audio Suite IndexTTS unload
#     file: ~/ComfyUI/custom_nodes/TTS-Audio-Suite/engines/index_tts/indextts/infer_v2_5.py
#     marker: "LOCAL PATCH (vhotseat)"           # a comment you put next to your change
#     doc: ~/.config/vhotseat/patches/tts-audio-suite.md   # optional: what and why
#     fixed_upstream_in: {version: 5.10.4, version_file: ~/ComfyUI/custom_nodes/TTS-Audio-Suite/pyproject.toml}
patches: []

events:
  keep: 500            # ~/.local/state/vhotseat/events.jsonl

# RAM and VRAM over time, events and log lines, for `vhotseat web`. Every
# vhotseat command records as it runs (~/.local/state/vhotseat/telemetry.db);
# `vhotseat record` (or `vhotseat web`) samples between commands too.
telemetry:
  # enabled: true
  retention_hours: 24  # ~6 MiB on disk with two workloads; ~0.8 MiB a day more per further workload
  interval_s: 5        # between samples while something samples continuously
