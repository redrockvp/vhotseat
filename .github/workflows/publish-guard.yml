# Publishes integrations/comfyui/vhotseat_guard to the ComfyUI Registry as
# vhotseat-guard when its version changes. Needs the REGISTRY_ACCESS_TOKEN secret.
# comfy-cli packages the git-tracked files under the directory it runs in.
name: Publish guard to the ComfyUI Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["integrations/comfyui/vhotseat_guard/pyproject.toml"]

jobs:
  publish:
    if: github.repository == 'wandermyz/vhotseat'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/comfyui/vhotseat_guard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from comfy-cli comfy --skip-prompt --no-enable-telemetry node publish --token "${{ secrets.REGISTRY_ACCESS_TOKEN }}"
