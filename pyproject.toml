[project]
name = "vhotseat"
version = "0.1.0"
description = "Take turns on one GPU: hand it between a local LLM (e.g. Strata, driven by an agent like pi), ComfyUI and any other workload, never interrupting running work."
requires-python = ">=3.10"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wandermyz" }]
keywords = ["gpu", "vram", "comfyui", "llm", "local-llm", "strata", "minimax-h3", "pi-agent", "scheduler"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = ["pyyaml>=6", "ruamel.yaml>=0.18"]

[project.urls]
Homepage = "https://github.com/wandermyz/vhotseat"
Issues = "https://github.com/wandermyz/vhotseat/issues"

[project.scripts]
vhotseat = "vhotseat.cli:main"
comfy-render = "vhotseat.kit.comfy_render:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# PyPI shows the README as the project page, where relative links don't resolve:
# point them at the GitHub copy of the same file instead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?!https?://|#)[^)\s]+)\)'
replacement = '](https://github.com/wandermyz/vhotseat/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/vhotseat"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # long lines are the house style

[tool.ruff.lint.per-file-ignores]
"tests/run_cli.py" = ["E402"]  # sets sys.path before importing vhotseat

[tool.hatch.build.targets.sdist]
exclude = [".github"]
