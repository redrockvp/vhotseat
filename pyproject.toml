[project]
name = "vhotseat"
version = "0.1.0"
description = "Take turns on one GPU: hand it between workloads without interrupting work."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.scripts]
vhotseat = "vhotseat.cli:main"
gpu-workload = "vhotseat.compat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vhotseat"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
